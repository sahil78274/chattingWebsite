<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <meta
      name="description"
      content="Connectly - private, real-time messaging for people across India. Search by username and start a conversation."
    />
    <title>Connectly — Private real-time messaging</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before paint to avoid a flash of the wrong theme.
      try {
        var stored = localStorage.getItem('connectly.theme');
        var theme = stored || 'dark';
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') document.documentElement.style.colorScheme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
